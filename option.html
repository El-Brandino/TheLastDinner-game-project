<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script defer src="app.js"></script>
    <title>Document</title>
    <link rel="stylesheet" href="Option Css/style.css">
</head>
<body id="option-page">
    <section class="container" id="container">
        <div class="featured-text">
            <h1 id="optText">Option</h1>
            <h3 id="langText">Language</h3>
        </div>
        <div class="featured-btn">
            <a>
                <img class="lang-btn" id="btnID" src="asset/Flag_of_Indonesia.png" alt="">
            </a>
            <a>
                <img class="lang-btn on" id="btnEN" src="asset/Flag_of_United_Kingdom.png" alt="">
            </a>
        </div>
        <div class="featured-back">
            <a id="backBtn" onclick="nextPage('menu.html')">
                Back
            </a>
        </div>
        <div class="featured-music">
            <div class="music">
                <button onclick="toggleImg()" id="btnBGM">
                    <img id="imgBtn" src="asset/volume-solid-full.svg" alt="">
                </button>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
        <audio id="menu-bgm" loop muted src="sound-asset/menu BGM.mp3"></audio>
    </section>
</body>
</html>
